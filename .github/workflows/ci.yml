name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The chain-backed tests skip themselves without BKC_EVM_RPC, BKC_COSMOS_RPC and
      # BKC_SEED, so this run covers the config and error paths only. Point the secrets at a
      # funded testnet account to have it deploy for real.
      - run: npm test
        env:
          BKC_EVM_RPC: ${{ secrets.BKC_EVM_RPC }}
          BKC_COSMOS_RPC: ${{ secrets.BKC_COSMOS_RPC }}
          BKC_SEED: ${{ secrets.BKC_SEED }}
          BKC_EXPLORER: ${{ secrets.BKC_EXPLORER }}
